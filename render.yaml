services:
  - type: web
    name: wave-digital-coach-bridge
    env: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: BYBIT_BASE_URL
        value: https://api.bytick.com
      - key: ALLOWED_SYMBOLS
        value: BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,ADAUSDT
